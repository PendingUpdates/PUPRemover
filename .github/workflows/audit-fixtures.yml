name: Synthetic audit fixtures
on: [push, pull_request]
permissions:
  contents: read
jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Record interpreter
        run: python3 --version
      - name: Test synthetic planner
        run: python3 -B -m unittest discover -s audit-planner/tests -v
      - name: Test safe entry
        run: python3 -B -m unittest discover -s tests -v
